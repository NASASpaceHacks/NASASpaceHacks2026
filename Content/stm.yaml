caveats:
  - "Station values are heuristic team priorities, not published NASA values; they must not be quoted as such."
  - "Station coordinates are Curiosity rover waypoints matched by sol to blog posts, accurate to roughly 10-20 m."
  - "A suited crew is not Curiosity: instrument analogs are named only to show which measurement the crew action stands in for."
  - "CheMin/SAM results for the boxwork drill samples were not reported in the posts reviewed; this STM claims none."
  - "Science-aware selection reference: Candela & Wettergreen 2022, https://doi.org/10.1109/LRA.2022.3191949"
