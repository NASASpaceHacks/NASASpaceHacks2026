caveats:
  - "Station values are heuristic team priorities, not published NASA values; they must not be quoted as such."
  - "Station coordinates are Perseverance end-of-drive localizations (M20_waypoints.json) for the sampling sol, i.e. the rover's parked position, accurate to roughly 10-20 m; they are not surveyed target positions."
  - "Sample collection sols come from the sample designations in Herd et al. 2025 (e.g. M2020-490-11 = collected sol 490); NASA's sample list gives sealing sols, which differ for Mageik, Kukaklek, Otis Peak and Pilot Mountain."
  - "Organics at Wildcat Ridge: NASA (2022) reported SHERLOC organic detections correlated with sulfates, while Herd et al. 2025 report no carbonaceous Raman bands at light-toned sulfate-rich outcrops. Treat the organic signal as unresolved."
  - "Individual depot tube positions are not in the waypoint file; JZ08 uses the rover position on the first drop sol (653)."
  - "A suited crew is not Perseverance: instrument analogs only show which rover measurement the crew action stands in for."
